[mod]
id = "tkatt_skills"
version = "0.2.3"
priority = 100

# Tested on this commit: the melee and fist hooks name game functions beyond
# the stable hook points, so the bundle pins the Nightly it was written for
# (Nightly 2026-11-08).
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# The mod's logic and its tests, as a module of the game crate.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "tkatt_skills"
source = "runtime.rs"

[[injection]]
id = "hud"
hook = "hud"
hook_version = 1
kind = "HEAD"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[injection]]
id = "key"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "command"
hook = "command"
hook_version = 1
kind = "HEAD"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# Melee damage: the tree scales what Player.attack computed. The initial store
# of `amount` is modified rather than the tuple return, because a RETURN moves
# the body's exit values and newer horizon-mixins refuses the closures in
# `melee_damage`. Later stores are compound writes, which MODIFY_VARIABLE
# cannot select; scaling the base amount means a critical hit multiplies the
# tree's bonus with the rest of the hit, like a strength bonus does.
[[injection]]
id = "melee"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::Game<'_>::melee_damage"
variable = { name = "amount", ordinal = 0, at = "STORE" }
require = 4
ordinal = 0
helper = "melee.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "value", ty = "f32", value = "$value" },
]

# Damage the player takes. The one path that funnels a mob's hit through
# `hurt_player_from` is scaled before it gets there; direct damage types go
# through `hurt_player_by`, where the amount handed to the health component is
# scaled. Fall, fire and the other motion events are left to vanilla: their
# bodies carry `?`, so reducing them means cancelling and re-applying the
# damage, which would skip any other mod's hooks inside those functions.
[[injection]]
id = "armor_hit"
kind = "MODIFY_ARG"
target = "horizon_client::game::creatures::Game<'_>::mob_hits_player"
selector = "self.hurt_player_from"
require = 1
ordinal = 0
argument = 0
helper = "armor.rs"
bindings = [
  { name = "value", ty = "f32", value = "$value" },
]

[[injection]]
id = "armor_direct"
kind = "MODIFY_ARG"
target = "horizon_client::game::creatures::Game<'_>::hurt_player_by"
selector = "player.hurt_blocking"
require = 1
ordinal = 0
argument = 3
helper = "armor.rs"
bindings = [
  { name = "value", ty = "f32", value = "$value" },
]

# Fists: a bare hand mines and drops as the unlocked pickaxe tier. The tier is
# read from the player's own skills where the game asks for the speed or the
# drop, so the item rules keep no copy of it and no other crate holds state.
[[injection]]
id = "fist_progress_mine"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::hand::Game<'_>::destroy_progress"
variable = { name = "speed", ordinal = 0, at = "STORE" }
require = 5
ordinal = 0
helper = "mining.rs"
bindings = [
  { name = "value", ty = "f32", value = "$value" },
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "facts", ty = "&horizon_items::blocks::StateFacts", value = "$local_ref:facts:0" },
]

[[injection]]
id = "fist_drops_tool"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::Game<'_>::break_block_as_player"
variable = { name = "correct_tool", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "fist_drops.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "facts", ty = "&horizon_items::blocks::StateFacts", value = "$local_ref:facts:0" },
]

[[injection]]
id = "fist_drops_harvest"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::Game<'_>::break_block_as_player"
variable = { name = "harvest", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "fist_drops.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "facts", ty = "&horizon_items::blocks::StateFacts", value = "$local_ref:facts:0" },
]

# The screen's three hooks: drawing it, taking its clicks and stopping the
# Bank button. The pointer is free while it is open, so these are the whole
# interaction; the bar in the world takes no clicks at all.
[[injection]]
id = "screen_render"
hook = "screen_render_post"
hook_version = 1
kind = "HEAD"
helper = "screen_render.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "screen_press"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
kind = "HEAD"
cancellable = true
helper = "screen_press.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]

[[injection]]
id = "screen_release"
hook = "screen_mouse_button_released_pre"
hook_version = 1
kind = "HEAD"
cancellable = true
helper = "screen_release.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]

# Fortune: the big skill adds a drop to what the block already gave. The loot
# list's own `drops` store is modified, because `block_loot_at`'s body contains
# an opaque macro and RETURN refuses it.
[[injection]]
id = "fortune"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::Game<'_>::break_block_as_player"
variable = { name = "drops", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "fortune.rs"
bindings = [
  { name = "value", ty = "Vec<horizon_client::items::ItemStack>", value = "$value" },
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

# Haste: every break grants the effect, bare hand or tool, so it hooks the break
# itself rather than the held item's damage step.
[[injection]]
id = "haste"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::break_block_as_player"
helper = "haste.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
